# Gradle Configuration for 16 KB Page Size Support (Android 15+)

# Android Build Properties
org.gradle.jvmargs=-Xmx4096m

# NDK Configuration - Use NDK r27+ for 16 KB page size support
android.ndkVersion=27.0.12158134

# 16 KB Page Size Support (Required for Android 15+)
android.useMinimalKeepRules=true

# Enable native code support
android.enableNativeCompile=true

# Gradle settings
android.useAndroidX=true
android.enableJetifier=true

# Build settings
android.enableNonCompileSdkLibraries=true
